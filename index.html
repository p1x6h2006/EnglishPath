<p class="m">Chọn một bậc để lọc ngữ pháp, từ vựng, 9 kỹ năng và bài tập. Bấm lại để bỏ lọc.</p>

<script>
const $=s=>document.querySelector(s);
const LV=[["A1","Sơ cấp","Giới thiệu bản thân, đặt câu đơn giản, nắm khoảng 500–800 từ đầu tiên.","1–2 tháng","IELTS dưới 3.0"],
["A2","Cơ bản","Hội thoại hằng ngày, kể chuyện quá khứ, khoảng 1.500 từ.","2–3 tháng","IELTS 3.0–4.0"],
["B1","Trung cấp","Nêu ý kiến, đọc bài ngắn, khoảng 2.500 từ. Chuẩn đầu ra phổ biến ở nhiều trường đại học.","3–4 tháng","IELTS 4.0–5.0, VSTEP bậc 3"],
["B2","Trung cao","Hiểu tài liệu kỹ thuật, tranh luận lưu loát, khoảng 4.000 từ.","4–6 tháng","IELTS 5.5–6.5, VSTEP bậc 4"],
["C1","Cao cấp","Viết học thuật, nghe giảng, dùng từ linh hoạt theo ngữ cảnh.","6–9 tháng","IELTS 7.0–8.0, VSTEP bậc 5"],
["C2","Thành thạo","Hiểu sắc thái tinh tế, diễn đạt gần như người bản ngữ.","9 tháng trở lên","IELTS 8.5–9.0"]];
const G=[["A1","Động từ to be","I am, you are, he/she/it is. Phủ định: thêm not. Câu hỏi: đưa be lên trước chủ ngữ.","I’m a student.=Tôi là sinh viên.|Is she your teacher?=Cô ấy là giáo viên của bạn à?|They aren’t here.=Họ không ở đây."],
["A1","Hiện tại đơn","Dùng cho thói quen và sự thật. Thêm s/es với he/she/it. Phủ định: don’t/doesn’t + V. Hỏi: Do/Does + S + V.","He codes every day.=Anh ấy viết code mỗi ngày.|Do you drink coffee?=Bạn có uống cà phê không?|She doesn’t like spam.=Cô ấy không thích thư rác."],
["A2","Quá khứ đơn","Hành động đã xong. Thêm -ed hoặc dùng dạng bất quy tắc (go → went). Phủ định và câu hỏi dùng did + V.","I installed Linux last week.=Tuần trước tôi đã cài Linux.|Did you finish the lab?=Bạn làm xong bài thực hành chưa?"],
["A2","So sánh hơn và nhất","Tính từ ngắn: -er / the -est. Tính từ dài: more / the most. Bất quy tắc: good → better → best.","This laptop is faster than mine.=Chiếc laptop này nhanh hơn của tôi.|She is the most careful tester.=Cô ấy là người kiểm thử cẩn thận nhất."],
["B1","Hiện tại hoàn thành","have/has + V3. Dùng cho kinh nghiệm, kết quả còn liên quan hiện tại, hoặc đi với for/since.","I’ve worked here for two years.=Tôi đã làm việc ở đây được hai năm.|Have you ever used Docker?=Bạn từng dùng Docker bao giờ chưa?"],
["B1","Điều kiện loại 1 và 2","Loại 1 (có thể xảy ra): If + hiện tại, will + V. Loại 2 (không có thật ở hiện tại): If + quá khứ, would + V.","If it rains, we’ll stay in.=Nếu trời mưa, chúng ta sẽ ở nhà.|If I were you, I’d back up the data.=Nếu tôi là bạn, tôi sẽ sao lưu dữ liệu."],
["B2","Câu bị động","be + V3. Dùng khi người thực hiện không quan trọng hoặc chưa biết.","The bug was fixed yesterday.=Lỗi đó đã được sửa hôm qua.|The system is being updated.=Hệ thống đang được cập nhật."],
["B2","Câu tường thuật","Lùi một thì: am/is → was, will → would, can → could. Đổi đại từ và trạng từ chỉ thời gian.","She said she would call back.=Cô ấy nói sẽ gọi lại.|He asked if I had finished.=Anh ấy hỏi tôi đã xong chưa."],
["C1","Đảo ngữ","Đưa trạng từ phủ định lên đầu rồi đảo trợ động từ: never, rarely, not only, hardly … when.","Never have I seen such clean code.=Tôi chưa bao giờ thấy đoạn code nào sạch đến thế.|Not only did it crash, but it also deleted data.=Nó không chỉ bị treo mà còn xóa mất dữ liệu."],

<script>
const S=[
["✅","Từ vựng","Tất cả các từ, nghĩa của từ","happy, computer, go","Vocabulary is the set of words you know and can use. Learn words in context, together with collocations (make a decision, not do a decision), word families (decide, decision, decisive), and both meaning and usage.","Từ vựng là tập hợp các từ bạn biết và dùng được. Hãy học từ trong ngữ cảnh, kèm các cụm đi chung (make a decision chứ không phải do a decision), họ từ (decide, decision, decisive), cả nghĩa lẫn cách dùng.","Học 5–10 từ mỗi ngày, ôn lại sau 1, 3, 7 ngày (lặp lại ngắt quãng).|Ghi từ loại và một câu ví dụ do chính bạn đặt.|Học theo chủ đề (công việc, du lịch, IT) để dễ nhớ hơn.","make a decision=đưa ra quyết định|heavy rain=mưa lớn (không nói strong rain)|decide / decision / decisive=quyết định / sự quyết định / quyết đoán|bank=ngân hàng hoặc bờ sông, tùy ngữ cảnh"],
["✅","Ngữ pháp","Quy tắc sắp xếp câu, chia thì, cấu trúc","I am going to school / She has eaten","Grammar is the system of rules for word order, tenses and sentence structure. It shows how words combine so that your listener understands exactly what you mean, such as when something happened or whether it is real or imaginary.","Ngữ pháp là hệ thống quy tắc về trật tự từ, thì và cấu trúc câu. Nó cho biết các từ kết hợp thế nào để người nghe hiểu đúng ý bạn, ví dụ việc xảy ra khi nào, thật hay chỉ là giả định.","Học một cấu trúc rồi tự đặt 3 câu thật của bản thân.|Đọc lại bài viết của mình để bắt lỗi thì và chia động từ.|Chú ý lỗi hay gặp: quên s ở ngôi thứ ba, quên mạo từ.","I am going to school=Tôi đang đi học|She has eaten=Cô ấy đã ăn rồi|She goes to work (không phải She go)=Cô ấy đi làm|If I were you, I’d go=Nếu tôi là bạn, tôi sẽ đi"],
["📢","Phát âm","Cách đọc từng âm, từ, nhấn trọng âm, ngắt nghỉ","record /ˈrekɔːd/ (danh từ) vs /rɪˈkɔːd/ (động từ)","Pronunciation covers individual sounds, word stress, sentence stress, rhythm and intonation. Wrong stress can change the meaning of a word or make it hard to understand even when the grammar is perfect.","Phát âm gồm âm riêng lẻ, trọng âm từ, trọng âm câu, nhịp điệu và ngữ điệu. Nhấn sai có thể đổi nghĩa của từ hoặc khiến người nghe khó hiểu dù ngữ pháp hoàn hảo.","Tra phiên âm IPA của từng từ mới, đừng đoán.|Nghe từ điển đọc rồi nhại lại (shadowing).|Luyện cặp âm dễ nhầm: ship/sheep, thin/tin.","record /ˈrekɔːd/ (n) vs /rɪˈkɔːd/ (v)=bản ghi / ghi lại|present /ˈpreznt/ vs /prɪˈzent/=món quà / trình bày|ship /ʃɪp/ vs sheep /ʃiːp/=con tàu / con cừu (nguyên âm ngắn và dài)|thirty vs thirteen=30 và 13, khác nhau ở chỗ nhấn âm"],
["🎤","Nghe hiểu","Khả năng nghe và hiểu nội dung nói","Nghe hội thoại, tin tức, bài giảng","Listening is the ability to understand spoken English. Real speech is fast and connected: sounds link together, weak words shrink, and speakers use fillers. Train your ear with different accents and speeds.","Nghe hiểu là khả năng hiểu tiếng Anh nói. Lời nói thật rất nhanh và nối âm: các âm dính vào nhau, từ yếu bị đọc lướt, người nói hay dùng từ đệm. Hãy luyện tai với nhiều giọng và tốc độ.","Nghe lần 1 lấy ý chính, lần 2 bắt chi tiết, lần 3 đọc transcript.|Chép chính tả (dictation) từng đoạn ngắn 30 giây.|Dùng podcast, TED, tin tức; bật phụ đề tiếng Anh rồi tắt dần.","What do you want to do?=Nối âm: “wanna” /ˈwɒnə/|I’m gonna grab a coffee=Mình đi mua cà phê đây (gonna = going to)|Could you repeat that, please?=Bạn nhắc lại được không?|Pardon? / Sorry?=Xin lỗi, bạn nói gì ạ?"],
["💬","Nói","Diễn đạt ra lời, giao tiếp trực tiếp","Nói chuyện, thuyết trình, trao đổi","Speaking is expressing ideas aloud and interacting in real time. Fluency matters more than perfection: keep going, use fillers and rephrase when you get stuck, and aim to be clear rather than flawless.","Nói là diễn đạt ý tưởng thành lời và tương tác trực tiếp. Sự trôi chảy quan trọng hơn sự hoàn hảo: cứ nói tiếp, dùng từ đệm và diễn đạt lại khi bí, ưu tiên rõ ràng hơn là không sai chút nào.","Mỗi ngày tự nói 2 phút về một chủ đề rồi ghi âm nghe lại.|Học sẵn các mẫu câu mở lời, đồng ý, phản đối.|Tìm bạn luyện nói hoặc nói chuyện với trợ lý AI.","Well, let me think…=Ừm, để mình nghĩ đã…|Could you speak more slowly?=Bạn nói chậm hơn được không?|In my opinion…=Theo ý kiến của tôi…|What I mean is…=Ý tôi muốn nói là…"],
["📖","Đọc hiểu","Đọc và nắm bắt nội dung văn bản","Đọc bài báo, sách, tài liệu","Reading comprehension means understanding written text. Use skimming for the main idea, scanning for specific facts, and guess unknown words from context instead of stopping at every word.","Đọc hiểu là hiểu nội dung văn bản. Dùng skimming (đọc lướt) để nắm ý chính, scanning (quét) để tìm thông tin cụ thể, và đoán từ lạ qua ngữ cảnh thay vì dừng lại ở mỗi từ.","Đọc tiêu đề, câu đầu mỗi đoạn trước khi đọc kỹ.|Gạch chân từ khóa, không tra từ điển ngay lần đọc đầu.|Chọn tài liệu hơi khó hơn trình độ một chút (khoảng 95% từ đã biết).","skim=đọc lướt lấy ý chính|scan=quét tìm số, tên, ngày|The main idea is…=Ý chính là…|It can be inferred that…=Có thể suy ra rằng…"],
["✍️","Viết","Diễn đạt bằng chữ, cấu trúc bài viết","Viết thư, bài luận, báo cáo","Writing is expressing ideas in text with clear structure: an introduction, body paragraphs (one main idea each) and a conclusion. Choose the right register, formal for emails to a boss, casual for friends.","Viết là diễn đạt ý bằng chữ với cấu trúc rõ ràng: mở bài, thân bài (mỗi đoạn một ý chính) và kết bài. Chọn đúng văn phong: trang trọng khi viết cho sếp, thân mật khi viết cho bạn.","Lập dàn ý 3 dòng trước khi viết.|Viết xong để nguội một lúc rồi đọc lại và sửa.|Học các từ nối để bài mạch lạc.","Dear Mr. Smith,=Kính gửi ông Smith|I am writing to inquire about…=Tôi viết thư để hỏi về…|First, … Moreover, … In conclusion,=Trước hết… Hơn nữa… Tóm lại|Best regards,=Trân trọng"],
["🗣️","Giao tiếp thực tế / Ngữ dụng ngôn ngữ","Cách nói phù hợp hoàn cảnh, văn hóa, phép lịch sự","Không nói “Give me water” mà dùng “Could I have some water, please?”","Pragmatics is about using language appropriately: who you talk to, in which situation, and what you really mean. Native speakers often use indirect language, so “It’s a bit cold in here” can mean “Please close the window”.","Ngữ dụng học là dùng ngôn ngữ cho phù hợp: nói với ai, trong tình huống nào, và thật sự muốn nói gì. Người bản xứ hay nói gián tiếp, nên “It’s a bit cold in here” có thể nghĩa là “Làm ơn đóng cửa sổ giúp”.","Dùng Could / Would + please khi nhờ vả.|Câu hỏi thăm How are you? thường chỉ là lời chào, đáp ngắn gọn.|Từ chối nhẹ nhàng bằng I’m afraid… hoặc Thanks, but…","Could I have some water, please?=Cho tôi xin ít nước ạ (lịch sự)|Would you mind opening the window?=Bạn có phiền mở cửa sổ không?|I’m afraid I can’t make it.=Tiếc là tôi không đến được (từ chối lịch sự)|How are you? – Fine, thanks. And you?=Lời chào hỏi, không cần kể lể"],
["🎭","Thành ngữ & Từ lóng","Cụm từ có nghĩa không theo nghĩa đen","It’s raining cats and dogs = Trời mưa to","Idioms are fixed expressions whose meaning is different from the individual words. Slang is informal language used among friends. Learn them as whole chunks and avoid slang in formal writing or job interviews.","Thành ngữ là cụm cố định có nghĩa khác với nghĩa từng từ. Từ lóng là ngôn ngữ thân mật giữa bạn bè. Hãy học nguyên cụm và tránh từ lóng trong văn bản trang trọng hay phỏng vấn.","Học thành ngữ qua phim, bài hát, kèm tình huống dùng.|Đừng dịch từng chữ; hiểu nghĩa bóng.|Kiểm tra mức độ trang trọng (informal, slang) trong từ điển.","It’s raining cats and dogs=Trời mưa như trút nước|Break a leg!=Chúc may mắn!|Spill the beans=Lỡ tiết lộ bí mật|A piece of cake=Dễ như ăn bánh"],
["📝","Cụm từ & Kết nối từ","Cụm cố định, liên từ làm câu mượt mà","look forward to, however, therefore","Phrases (phrasal verbs, collocations) and linking words make English natural and cohesive. Linking words show relationships between ideas: contrast, cause, addition, sequence.","Các cụm từ (cụm động từ, collocation) và từ nối làm tiếng Anh tự nhiên và mạch lạc. Từ nối thể hiện quan hệ giữa các ý: tương phản, nguyên nhân, bổ sung, trình tự.","Nhớ look forward to + V-ing (to là giới từ).|Học từ nối theo nhóm chức năng.|Đừng lạm dụng một từ nối; thay đổi cho đa dạng.","look forward to seeing you=mong được gặp bạn|however / on the other hand=tuy nhiên / mặt khác (tương phản)|therefore / as a result=do đó / kết quả là (nguyên nhân – kết quả)|moreover / in addition=hơn nữa / thêm vào đó (bổ sung)"],
["🧠","Tư duy ngôn ngữ","Cách sắp xếp ý theo lối tư duy người bản xứ","Cấu trúc câu tiếng Anh thường: Trạng thái → Thời gian → Địa điểm","Thinking in English means organizing ideas the way native speakers do: a clear subject in every sentence, the main point first, then details. Do not translate word for word from Vietnamese; think in chunks and patterns.","Tư duy bằng tiếng Anh là sắp xếp ý như người bản xứ: câu nào cũng có chủ ngữ rõ ràng, nêu ý chính trước rồi mới đến chi tiết. Đừng dịch từng chữ từ tiếng Việt; hãy nghĩ theo cụm và khuôn mẫu.","Tự mô tả việc xung quanh bằng tiếng Anh trong đầu.|Học nguyên câu mẫu thay vì từng từ lẻ.|Chú ý lỗi dịch word-by-word và sửa dần.","Hôm qua mưa = It rained yesterday=Tiếng Anh cần chủ ngữ (it)|She worked hard at the office yesterday=Thường: cách thức → nơi chốn → thời gian|Conclusion first: The main problem is cost.=Nêu ý chính trước rồi giải thích|Bạn ăn cơm chưa? = Have you eaten yet?=Dịch ý, không dịch từng chữ"]];
views["mang"]=()=>`<p class="m">11 mảng kiến thức của tiếng Anh. Bấm từng mảng để xem giải thích chi tiết kèm bản dịch, mẹo luyện và ví dụ.</p><div class="tw"><table class="tb"><thead><tr><th>Mảng</th><th>Giải thích ngắn gọn</th><th>Ví dụ</th></tr></thead><tbody>`+S.map(s=>`<tr><td><b>${s[0]} ${s[1]}</b></td><td>${s[2]}</td><td><i>${s[3]}</i></td></tr>`).join("")+`</tbody></table></div><div class="card"><h3>💡 Tóm tắt gọn gàng</h3><p>Tiếng Anh gồm <b>4 kỹ năng chính</b>: <b>Nghe — Nói — Đọc — Viết</b>, cùng với <b>3 nền tảng</b>: <b>Từ vựng — Ngữ pháp — Phát âm</b>, và các yếu tố nâng cao: <b>thành ngữ, văn hóa giao tiếp, phong cách, ngữ điệu</b>…</p><p>Nếu chỉ học từ vựng + ngữ pháp, bạn có thể <b>viết được câu đúng</b> nhưng <b>nghe không hiểu, nói không tự nhiên, đọc chậm, viết không mượt</b>. Hãy phát triển đều tất cả nhé! 😊</p></div>`+S.map(s=>`<details class="card"><summary>${s[0]} ${s[1]}</summary><h4>English</h4><p>${s[4]}</p><h4>Bản dịch tiếng Việt</h4><p>${s[5]}</p><h4>Mẹo luyện tập</h4><ul>${s[6].split("|").map(t=>`<li>${t}</li>`).join("")}</ul><h4>Ví dụ</h4><div class="tw"><table class="tb"><tbody>`+s[7].split("|").map(x=>{const p=x.split("=");return`<tr><td><i>${p[0]}</i></td><td>${p[1]}</td></tr>`}).join("")+`</tbody></table></div></details>`).join("");
T.splice(1,0,["mang","Các mảng"]);
const AQ=[["B1","Collocation đúng với “decision” là gì?","make a decision",["do a decision","take a decide"],"Decision đi với make (hoặc take)."],["B1","I ___ this movie twice.","have seen",["seen","am seeing"],"Kinh nghiệm dùng hiện tại hoàn thành."],["B1","Danh từ “record” nhấn âm nào?","Âm thứ nhất: RE-cord",["Âm thứ hai: re-CORD","Hai âm nhấn như nhau"],"Danh từ nhấn âm đầu, động từ nhấn âm sau."],["B1","“I’m gonna go” thực chất là gì?","I’m going to go",["I’m gone go","I’m gonna be gone"],"Gonna là dạng nối âm của going to."],["A2","Cách nhờ người khác nói chậm lại lịch sự nhất?","Could you speak more slowly, please?",["Speak slowly!","You speak slow."],"Could you… please là mẫu nhờ vả lịch sự."],["B1","Skimming là gì?","Đọc lướt để nắm ý chính",["Đọc từng chữ để dịch","Chỉ tìm một con số cụ thể"],"Tìm thông tin cụ thể là scanning."],["B1","Mỗi đoạn văn nên có mấy ý chính?","Một ý chính",["Càng nhiều càng tốt","Không cần ý chính"],"One paragraph, one main idea."],["A2","Cách xin nước lịch sự nhất?","Could I have some water, please?",["Give me water.","Water!"],"Could I… please lịch sự hơn câu mệnh lệnh."],["B1","“It’s raining cats and dogs” nghĩa là gì?","Mưa rất to",["Có mèo và chó rơi xuống","Trời sắp tạnh"],"Thành ngữ không hiểu theo nghĩa đen."],["B1","I look forward to ___ you.","seeing",["see","saw"],"Look forward to + V-ing (to là giới từ)."],["B1","Câu tiếng Anh đúng cho “Hôm qua mưa”?","It rained yesterday.",["Rained yesterday.","Yesterday rain."],"Tiếng Anh cần chủ ngữ (it)."]];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=(l,p,c,w,ex)=>{const o=sh([c,...w]);return[l,p,o,o.indexOf(c),ex]};
function pool(){const o=[];Q.filter(F).forEach(q=>o.push(mk(q[0],q[1],q[2][q[3]],q[2].filter((_,i)=>i!=q[3]),q[4])));
AQ.filter(F).forEach(q=>o.push(mk(q[0],q[1],q[2],q[3],q[4])));
V.filter(F).forEach(w=>o.push(mk(w[0],`“${w[1]}” có nghĩa là gì?`,w[3],sh(V.map(x=>x[3]).filter(m=>m!=w[3])).slice(0,2),`${w[1]} ${w[2]} = ${w[3]}. Ví dụ: ${w[4]}`)));
P.filter(F).forEach(p=>o.push(mk(p[0],`Cụm “${p[1]}” nghĩa là gì?`,p[2],sh(P.map(x=>x[2]).filter(m=>m!=p[2])).slice(0,2),`${p[1]} = ${p[2]}. Ví dụ: ${p[3]}`)));return o}
const M={cnt:20,qs:null,i:0,sc:0,a:null};
views["luyen-tap"]=()=>{if(!M.qs){const n=pool().length,mx=Math.min(100,n),c=Math.min(M.cnt,mx);
return `<div class="card"><h3>Chọn số câu hỏi</h3><p class="m">Câu hỏi được trộn ngẫu nhiên từ ngữ pháp, từ vựng, cụm từ, thành ngữ và các mảng kiến thức. Kho hiện có ${n} câu ở lựa chọn này${n<100?`, nên tối đa ${n} câu`:""}.</p><label class="m" for="rg">Số câu (từ ${Math.min(10,mx)} đến ${mx})</label><input type="number" id="rg" class="ni" min="${Math.min(10,mx)}" max="${mx}" step="1" value="${c}" inputmode="numeric" aria-label="Số câu hỏi"><p>`+[10,25,50,100].filter(x=>x<=mx).map(x=>`<button class="c${x==c?" on":""}" data-cnt="${x}">${x}</button>`).join("")+`</p><button class="b p" data-qstart="1">Bắt đầu luyện tập</button></div>`}
if(M.i>=M.qs.length)return `<div class="card"><h3>Kết quả: ${M.sc}/${M.qs.length}</h3><p>${Math.round(M.sc/M.qs.length*100)}% câu đúng. ${M.sc==M.qs.length?"Hoàn hảo!":"Xem lại các mục liên quan rồi làm lại bộ câu mới nhé."}</p><button class="b p" data-qstart="1">Bộ câu mới (ngẫu nhiên)</button> <button class="b" data-qreset="1">Đổi số câu</button></div>`;
const q=M.qs[M.i];return `<p class="m">Câu ${M.i+1}/${M.qs.length} (${q[0]}) · Đúng ${M.sc}</p><div class="card"><h3>${q[1]}</h3>`+q[2].map((o,j)=>`<button class="b opt${M.a==null?"":j==q[3]?" ok":j==M.a?" no":""}" data-qa="${j}">${o}</button>`).join("")+(M.a==null?"":`<p>${q[4]}</p><button class="b p" data-qn="1">${M.i+1==M.qs.length?"Xem kết quả":"Câu tiếp theo"}</button>`)+`</div><button class="c" data-qreset="1">Thoát</button>`};
document.addEventListener("click",e=>{const d=e.target.closest("[data-l],[data-t],[data-cnt],[data-qstart],[data-qa],[data-qn],[data-qreset]");if(!d)return;const s=d.dataset;
if(s.l!=null||s.t)M.qs=null;
if(s.cnt)M.cnt=+s.cnt;
if(s.qstart){const L=pool().length,n=Math.max(Math.min(10,L),Math.min(+M.cnt||10,100,L));M.qs=sh(pool()).slice(0,n);M.i=M.sc=0;M.a=null}
if(s.qa!=null&&M.a==null){M.a=+s.qa;if(M.a==M.qs[M.i][3])M.sc++}
if(s.qn){M.i++;M.a=null}
if(s.qreset)M.qs=null;
R()});
document.addEventListener("input",e=>{if(e.target.id=="rg")M.cnt=+e.target.value||0});document.addEventListener("change",e=>{if(e.target.id=="rg"){const mx=+e.target.max,mn=+e.target.min;const v=Math.max(mn,Math.min(mx,Math.round(+e.target.value||mn)));M.cnt=v;e.target.value=v}});
R();

ensibly (bề ngoài) và counterproductive (phản tác dụng) cho thấy thái độ phê phán."], ["C1", "Automation", "Proponents argue that automation will liberate workers from tedious tasks; sceptics counter that the gains will accrue disproportionately to shareholders, leaving displaced employees to fend for themselves.", "Người ủng hộ cho rằng tự động hóa sẽ giải phóng người lao động khỏi việc nhàm chán; người hoài nghi phản bác rằng lợi ích sẽ dồn về cổ đông, còn nhân viên mất việc phải tự xoay xở.", "What do sceptics fear?", "Người hoài nghi lo ngại điều gì?", ["Unequal distribution of benefits", "Too many tedious tasks", "Shareholders losing money"], ["Lợi ích phân bổ không đều", "Quá nhiều việc nhàm chán", "Cổ đông thua lỗ"], 0, "“accrue disproportionately to shareholders” nghĩa là lợi ích dồn về cổ đông."], ["C1", "A cautious study", "The authors stress that their findings, while suggestive, cannot establish causation, since participants were self-selected and the sample was modest.", "Các tác giả nhấn mạnh rằng kết quả, dù gợi mở, không thể chứng minh quan hệ nhân quả vì người tham gia tự chọn và mẫu khá nhỏ.", "Why can’t the study prove causation?", "Vì sao nghiên cứu không chứng minh được quan hệ nhân quả?", ["The sample was small and self-selected", "The authors made errors", "The results were negative"], ["Mẫu nhỏ và tự chọn", "Tác giả mắc lỗi", "Kết quả tiêu cực"], 0, "Lý do nằm sau “since”: self-selected và modest sample."], ["C1", "Open-source software", "Open-source projects thrive on voluntary contributions, yet maintainers are frequently overwhelmed, receiving little recognition or funding for work on which entire industries depend.", "Các dự án mã nguồn mở phát triển nhờ đóng góp tự nguyện, nhưng người bảo trì thường quá tải, nhận rất ít ghi nhận hay tài trợ cho công việc mà cả ngành phụ thuộc.", "What problem do maintainers face?", "Người bảo trì gặp vấn đề gì?", ["Too much funding", "Overwork and little support", "Lack of users"], ["Quá nhiều tài trợ", What do the subtler variants claim?", "Các biến thể tinh tế hơn khẳng định điều gì?", ["Language completely determines thought", "Language can influence but not dictate attention", "Language has no effect on thought"], ["Ngôn ngữ quyết định hoàn toàn tư duy", "Ngôn ngữ có thể ảnh hưởng nhưng không quyết định sự chú ý", "Ngôn ngữ không ảnh hưởng tư duy"], 1, "“nudge, though not dictate” nghĩa là gợi hướng chứ không quyết định."], ["C2", "Market volatility", "The sudden downturn, attributable less to fundamentals than to herd behaviour, underscores how swiftly sentiment can eclipse analysis.", "Đợt giảm đột ngột, do tâm lý bầy đàn hơn là yếu tố cơ bản, cho thấy tâm lý có thể lấn át phân tích nhanh đến mức nào.", "What mainly caused the downturn?", "Nguyên nhân chính của đợt giảm là gì?", ["Herd behaviour", "Poor fundamentals", "Government policy"], ["Tâm lý bầy đàn", "Yếu tố cơ bản kém", "Chính sách chính phủ"], 0, "“attributable less to fundamentals than to herd behaviour”."]];

const k=C.k%qs.length,q=qs[k];return (first?"":(["Nice!","I see.","Interesting.","Good answer!"][(C.k)%4]+" "))+q[0]+"\nDịch: "+q[1]+r}
async function turn(first){if(C.busy)return;let t="";if(first){C.m=[{role:"user",content:"Start the conversation: greet me and ask your first question."}];C.d=[]}else{const mi=$("#mi");t=mi.value.trim();if(!t)return;mi.value="";C.m.push({role:"user",content:t});C.d.push({r:"u",t})}
C.busy=true;upd();
try{const sm=window.claude?await getSample():null;
if(!sm){const o=offline(first,t);await new Promise(z=>setTimeout(z,350));C.m.push({role:"assistant",content:o});C.d.push({r:"a",t:o});const cb0=$("#sy");if(cb0&&cb0.checked)say(parts(o).en);C.busy=false;upd();return}
const ins=`You are a friendly English speaking partner for a Vietnamese learner at CEFR level ${lv()}. Scenario: ${SCN[C.sc][1]}. Rules: reply in natural English suited to that level, 1-3 short sentences, and end with one question to keep the conversation going. If the learner’s latest message has grammar, vocabulary or word-choice mistakes, add a new final line that starts exactly with "Sửa:" giving, in Vietnamese, the corrected sentence and a brief reason. If there are no mistakes, add no such line. Never write more than 60 words in English.`;
const r=await sm(C.m.map((m,i)=>i?m:{role:"user",content:ins+"\n\n"+m.content}),{cache:false,modelTier:"quick"});
C.m.push({role:"assistant",content:r.text});C.d.push({r:"a",t:r.text});
const cb=$("#sy");if(cb&&cb.checked)say(parts(r.text).en)}
catch(e){if(C.m.length&&C.m[C.m.length-1].role=="user")C.m.pop();C.d.push({r:"e",t:"Chưa gọi được trợ lý: "+(e.message||e.code||"lỗi không rõ")})}
C.busy=false;upd()}
